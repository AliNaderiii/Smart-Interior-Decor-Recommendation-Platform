# Executable GitHub Actions workflow.
# Source configuration was adapted from ci/github-ci.yml.
# Keep this file synchronized with the reviewed CI definition.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — pytest vs Postgres16+pgvector & Redis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.6.2-pg16
        env:
          POSTGRES_USER: decor
          POSTGRES_PASSWORD: decor
          POSTGRES_DB: decor_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U decor -d decor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://decor:decor@localhost:5432/decor_test
      TEST_DATABASE_URL: postgresql+psycopg://decor:decor@localhost:5432/decor_pgvector_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/9
      AI_PROVIDER: mock
      EMBEDDING_BACKEND: hash
      STORAGE_BACKEND: local
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock
      SECRET_KEY: ci-secret
      APP_ENV: test
      SEED_DEMO_ACCOUNTS: "true"
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      # Stage 1 (T-1.5): "we install the locked set" is a claim, not evidence.
      # Verify the RESOLVED environment against the lockfile BEFORE any extra
      # tooling is layered on, and publish the freeze diff as a job artifact.
      - name: Verify locked install (pip freeze diff)
        working-directory: backend
        run: |
          python scripts/verify_lock_install.py \
            --json-out lock-verification.json \
            --freeze-out pip-freeze.txt \
            --strict-extra \
            | tee lock-verification.log

      - name: Upload locked-install proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lock-verification
          path: |
            backend/lock-verification.json
            backend/lock-verification.log
            backend/pip-freeze.txt
            backend/requirements.lock.txt

      - name: Install CI-only tooling
        working-directory: backend
        run: |
          pip install ruff pip-audit pyyaml

      - name: Create dedicated pgvector database
        working-directory: backend
        run: |
          python - <<'PY'
          import psycopg

          conn = psycopg.connect(
              "postgresql://decor:decor@localhost:5432/decor_test",
              autocommit=True,
          )

          exists = conn.execute(
              "SELECT 1 FROM pg_database "
              "WHERE datname = 'decor_pgvector_test'"
          ).fetchone()

          if not exists:
              conn.execute("CREATE DATABASE decor_pgvector_test")

          print("decor_pgvector_test ready")
          conn.close()
          PY

      - name: Migrate — upgrade head
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Migration round-trip — downgrade base then upgrade head
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short

      - name: Run real-service AI modules without skips
        working-directory: backend
        run: |
          set -o pipefail

          pytest -q \
            tests/test_pgvector_real.py \
            tests/test_recommender_redis_real.py \
            -ra \
            --tb=short \
            | tee pytest-realservices.log

          if grep -qi "skipped" pytest-realservices.log; then
            echo "::error::Real-service AI tests were skipped."
            echo "::error::Check TEST_DATABASE_URL, TEST_REDIS_URL, and service availability."
            exit 1
          fi

          echo "Real-service AI modules executed successfully without skips."

      - name: Lint
        working-directory: backend
        run: |
          ruff check app ai scripts tests

      # Stage 1 (T-1.5): audit the LOCKED set, not the ranges in
      # requirements.txt. Auditing ranges audits whatever resolves today,
      # which is neither what CI installs nor what ships. Findings may be
      # accepted only via security/pip-audit-allowlist.yml, where every entry
      # carries an owner, a justification and a MANDATORY expiry date — an
      # expired acceptance fails this step.
      - name: Dependency audit (locked set + expiring allowlist)
        working-directory: backend
        run: |
          python scripts/audit_dependencies.py \
            --requirements requirements.lock.txt \
            --allowlist security/pip-audit-allowlist.yml \
            | tee dependency-audit.log

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit
          path: |
            backend/dependency-audit.log
            backend/security/pip-audit-allowlist.yml

      - name: Security probe — production demo seeding refusal
        working-directory: backend
        run: |
          python ../docs/security/probes/probe_demo_seeding.py

      - name: Security probe — production fail-safes
        working-directory: backend
        run: |
          python ../docs/security/probes/probe_production_failsafe.py

      - name: Extraction benchmark — MOCK mode
        working-directory: backend
        run: |
          python scripts/evaluate_extraction.py

      - name: Extraction benchmark — REAL mode when credential exists
        working-directory: backend
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python scripts/evaluate_extraction.py --real --sample 10 || {
              echo "::warning::REAL-mode extraction is below the configured threshold."
              echo "::warning::Human review gate remains active."
            }
          else
            echo "GEMINI_API_KEY is not configured; REAL-mode benchmark is BLOCKED/SKIPPED."
          fi

  multi-worker:
    name: Multi-worker shared-Redis verification
    runs-on: ubuntu-latest
    needs:
      - backend

    services:
      postgres:
        image: pgvector/pgvector:0.6.2-pg16
        env:
          POSTGRES_USER: decor
          POSTGRES_PASSWORD: decor
          POSTGRES_DB: decor_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U decor -d decor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://decor:decor@localhost:5432/decor_test
      REDIS_URL: redis://localhost:6379/2
      SECRET_KEY: ci-secret
      APP_ENV: test
      AI_PROVIDER: mock
      EMBEDDING_BACKEND: hash
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock
      STORAGE_BACKEND: local
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          # Stage 1 (T-1.5): same locked-set proof as the backend job.
          python scripts/verify_lock_install.py --strict-extra

      - name: Migrate empty PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Verify shared Redis across workers
        working-directory: backend
        run: |
          python scripts/verify_multi_worker_redis.py

  frontend:
    name: Frontend — install, lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Lint
        working-directory: frontend
        run: |
          npm run lint

      - name: Typecheck
        working-directory: frontend
        run: |
          npx tsc -b
          # Stage 1 (T-1.3/T-1.4): tsconfig.app.json only includes `src`, so
          # neither the Vitest suites nor the Playwright specs are covered by
          # the build's typecheck. This config adds them (same strict flags).
          npx tsc -p tsconfig.tests.json

      - name: Unit tests
        working-directory: frontend
        run: |
          npm test

      - name: Production build
        working-directory: frontend
        run: |
          npm run build

      - name: Dependency audit
        working-directory: frontend
        run: |
          npm audit --audit-level=low

      - name: Artifact secret scan
        working-directory: frontend
        run: |
          HITS=$(
            grep -rIE \
              "(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35})" \
              dist/ \
              | wc -l
          )

          echo "Credential-pattern hits in dist/: $HITS"
          test "$HITS" -eq 0

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: E2E — Playwright (auth negatives + three-role journeys)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.6.2-pg16
        env:
          POSTGRES_USER: decor
          POSTGRES_PASSWORD: decor
          POSTGRES_DB: decor_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U decor -d decor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://decor:decor@localhost:5432/decor_test
      REDIS_URL: redis://localhost:6379/2
      AI_PROVIDER: mock
      EMBEDDING_BACKEND: hash
      STORAGE_BACKEND: local
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock
      SECRET_KEY: ci-secret
      APP_ENV: test
      SEED_DEMO_ACCOUNTS: "true"
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          # Stage 1 (T-1.5): same locked-set proof as the backend job.
          python scripts/verify_lock_install.py --strict-extra

      - name: Migrate — upgrade head
        working-directory: backend
        run: |
          alembic upgrade head

      # Stage 1 (T-1.4 close-out): the homeowner and admin journeys need a
      # real catalogue (recommendations must return 3-5 products per category)
      # and the seeded demo accounts globalSetup logs in with.
      - name: Seed products and demo accounts
        working-directory: backend
        run: |
          python scripts/seed_products.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium

      - name: Start backend (uvicorn)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "backend up after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy"; cat /tmp/uvicorn-e2e.log
          exit 1

      - name: Start frontend (vite dev)
        working-directory: frontend
        run: |
          nohup npx vite --host 0.0.0.0 --port 5173 > /tmp/vite-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "frontend up after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "::error::frontend never became healthy"; cat /tmp/vite-e2e.log
          exit 1

      - name: Run Playwright e2e
        working-directory: frontend
        run: |
          E2E_BASE_URL=http://localhost:5173 npx playwright test

      # Stage 1 (T-1.4 close-out): the JSON + HTML reports are the evidence the
      # three-role journeys actually ran, so they are uploaded on success too,
      # not only when something breaks.
      - name: Upload e2e report (JSON + HTML) and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/test-results

  security-scans:
    name: Security & docs gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository secret scan
        run: |
          python scripts/audit_secrets.py

      - name: Documentation link audit
        run: |
          pip install pyyaml
          python scripts/audit_docs_links.py

      - name: Dead translation keys audit
        run: |
          npm install -g typescript tsx
          npx tsx scripts/auditDeadKeys.ts

  docker:
    name: Docker — compose config and image builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide placeholder environment
        run: |
          cp .env.example .env

      - name: Validate Compose files
        run: |
          docker compose config -q
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config -q
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config -q
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: decor-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: decor-frontend:ci

  lighthouse:
    name: Lighthouse CI — performance and accessibility
    runs-on: ubuntu-latest
    # WAIVED FOR STAGE 1 (IR-S1-010). The perf budget currently fails on TTI
    # (interactive 6727ms vs a 4000ms budget); performance tuning is Stage 2
    # scope, so this job reports but does not block. Stage-2 task G-2.6
    # removes this line and restores it as a required check.
    continue-on-error: true
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, migrate and seed backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          EMBEDDING_BACKEND: hash
          APP_ENV: test
          AI_PROVIDER: mock
          STORAGE_BACKEND: local
          PAYMENT_PROVIDER: mock
          EMAIL_PROVIDER: mock
          SECRET_KEY: ci-secret
          COOKIE_SECURE: "false"
        run: |
          python -m pip install --upgrade pip
          # Stage 1 (T-1.5): the lighthouse job was the last CI python install
          # still resolving the RANGES in requirements.txt, so it could measure
          # a dependency set no other job — and no deployment — ever used.
          pip install -r requirements.lock.txt
          python scripts/verify_lock_install.py --strict-extra
          python scripts/seed_products.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          EMBEDDING_BACKEND: hash
          APP_ENV: test
          AI_PROVIDER: mock
          STORAGE_BACKEND: local
          PAYMENT_PROVIDER: mock
          EMAIL_PROVIDER: mock
          SECRET_KEY: ci-secret
          COOKIE_SECURE: "false"
        run: |
          nohup uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/backend.log 2>&1 &

      - name: Build and preview frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

          nohup npm run preview \
            -- --host 127.0.0.1 --port 4173 \
            > /tmp/frontend-preview.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          set -e

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:8000/api/v1/health/ready \
              > /tmp/backend-ready.json; then

              echo "Backend readiness check passed."
              cat /tmp/backend-ready.json
              exit 0
            fi

            echo "Waiting for backend readiness: attempt $i/30"
            sleep 2
          done

          echo "::error::Backend did not become ready."
          cat /tmp/backend.log 2>/dev/null || true
          exit 1

      - name: Wait for frontend routes and API proxy
        run: |
          set -e

          frontend_ready=false

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:4173/ \
              > /tmp/frontend-home.html; then

              frontend_ready=true
              echo "Frontend preview became ready."
              break
            fi

            echo "Waiting for frontend preview: attempt $i/30"
            sleep 2
          done

          if [ "$frontend_ready" != "true" ]; then
            echo "::error::Frontend preview did not become ready."
            cat /tmp/frontend-preview.log 2>/dev/null || true
            exit 1
          fi

          curl -fsS \
            http://127.0.0.1:4173/ \
            > /tmp/frontend-home.html

          curl -fsS \
            http://127.0.0.1:4173/recommendations \
            > /tmp/frontend-recommendations.html

          curl -fsS \
            http://127.0.0.1:4173/api/v1/health/ready \
            > /tmp/frontend-proxy-ready.json

          grep -q '<div id="root"></div>' \
            /tmp/frontend-home.html

          grep -q '<div id="root"></div>' \
            /tmp/frontend-recommendations.html

          echo "Frontend home route passed."
          echo "Frontend recommendations route passed."
          echo "Frontend API proxy passed."

      - name: Show frontend and backend diagnostics
        if: always()
        run: |
          echo "Backend log:"
          cat /tmp/backend.log 2>/dev/null || true

          echo "Frontend preview log:"
          cat /tmp/frontend-preview.log 2>/dev/null || true

          echo "Backend readiness response:"
          cat /tmp/backend-ready.json 2>/dev/null || true

          echo "Frontend proxy readiness response:"
          cat /tmp/frontend-proxy-ready.json 2>/dev/null || true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/recommendations
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Assert performance and LCP/TTI thresholds
        run: |
          npm install -g lighthouse

          lighthouse http://127.0.0.1:4173/ \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output-path=./lighthouse-report.json \
            --quiet

          node - <<'NODE'
          const fs = require('fs');

          const report = JSON.parse(
            fs.readFileSync('./lighthouse-report.json', 'utf8')
          );

          const performanceScore = Math.round(
            report.categories.performance.score * 100
          );

          const lcp =
            report.audits['largest-contentful-paint']?.numericValue;

          const interactive =
            report.audits['interactive']?.numericValue;

          console.log('Performance:', performanceScore);
          console.log('LCP:', lcp);
          console.log('Interactive:', interactive);

          if (!Number.isFinite(lcp)) {
            console.error('LCP is null or non-numeric.');
            process.exit(1);
          }

          if (!Number.isFinite(interactive)) {
            console.error('Interactive is null or non-numeric.');
            process.exit(1);
          }

          if (performanceScore < 80) {
            console.error('Lighthouse performance score is below 80.');
            process.exit(1);
          }

          if (lcp > 3000) {
            console.error('LCP is greater than 3000 ms.');
            process.exit(1);
          }

          if (interactive > 4000) {
            console.error('Interactive is greater than 4000 ms.');
            process.exit(1);
          }
          NODE

      - name: Lighthouse report secret scan
        run: |
          HITS=$(
            grep -cE \
              "(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35})" \
              lighthouse-report.json \
              || true
          )

          echo "Credential-pattern hits: $HITS"
          test "$HITS" -eq 0

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
