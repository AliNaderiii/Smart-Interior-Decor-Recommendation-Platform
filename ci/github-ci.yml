name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — pytest (30 recommender + auth) & benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run test suite
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          REDIS_URL: ""
          AI_PROVIDER: mock
          EMBEDDING_BACKEND: hash
          PAYMENT_PROVIDER: mock
          SECRET_KEY: ci-secret
        run: pytest tests/ -v --tb=short
      - name: Extraction benchmark (>=80% required)
        working-directory: backend
        env:
          AI_PROVIDER: mock
        run: python scripts/evaluate_extraction.py
      - name: Lint (ruff)
        working-directory: backend
        run: pip install ruff && ruff check app ai scripts

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (tsc strict + vite)
        working-directory: frontend
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  lighthouse:
    name: Lighthouse CI (>=80 on recommendation page)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & seed backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          EMBEDDING_BACKEND: hash
        run: |
          pip install -r requirements.txt
          python scripts/seed_products.py
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          EMBEDDING_BACKEND: hash
          PAYMENT_PROVIDER: mock
          SECRET_KEY: ci-secret
        run: nohup uvicorn app.main:app --port 8000 &
      - name: Build & preview frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 4173 &
          sleep 3
      - name: Run Lighthouse
        run: |
          npm install -g lighthouse
          lighthouse http://localhost:4173/ \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=./lighthouse-report.json --quiet
          node -e "
            const r = require('./lighthouse-report.json');
            const perf = Math.round(r.categories.performance.score * 100);
            const lcp = r.audits['largest-contentful-paint'].numericValue;
            console.log('Performance:', perf, '| LCP:', Math.round(lcp), 'ms');
            if (perf < 80) { console.error('Lighthouse performance < 80'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
