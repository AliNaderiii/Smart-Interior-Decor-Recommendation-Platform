; =============================================================================
; supervisord — process manager for the single-container public demo
; =============================================================================
; PostgreSQL and Redis are started by entrypoint.sh BEFORE supervisord, because
; migrations and seeding must complete before anything is served: a visitor who
; arrives during a half-seeded boot sees an empty catalog and concludes the
; product is broken. supervisord owns only the two long-lived serving
; processes, and if either dies the container dies with it (exitcodes/autorestart
; below) so the Space restarts cleanly instead of serving a half-dead demo.
; =============================================================================
[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/data/logs/supervisord.pid
childlogdir=/data/logs
loglevel=info

[program:backend]
; 2 workers on the free shared-CPU tier: enough to keep the SPA responsive
; while one request is in a slow cold path, without thrashing the scheduler.
; Redis is real (not fakeredis), so rate limits and the JWT blacklist are
; genuinely shared across both workers.
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 --no-server-header --proxy-headers --forwarded-allow-ips=*
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
; Serves the built SPA and proxies /api, /media and /metrics to uvicorn. This
; is the only process bound to the public port.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[eventlistener:die-on-fatal]
; If either serving process enters FATAL, kill supervisord so the Space
; restarts the container. A demo that half-works is worse than one that is
; visibly restarting.
command=bash -c "printf 'READY\n'; while read -r line; do kill -SIGQUIT $PPID; printf 'RESULT 2\nOK'; done < /dev/stdin"
events=PROCESS_STATE_FATAL
