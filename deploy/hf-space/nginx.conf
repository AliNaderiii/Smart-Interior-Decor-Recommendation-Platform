# =============================================================================
# nginx — public entry point of the demo container   [Stage 4, Wave 2]
# =============================================================================
# Serves the built SPA and proxies the API to uvicorn on 127.0.0.1:8000.
# Listens on $PORT (7860 by default — must match app_port in the Space README).
#
# TLS: terminated by the Hugging Face platform edge, NOT here (deviation D-4c).
# Origin TLS verification and the Caddy header profile are parked for Stage 5;
# the security headers below are the demo's browser-side protection.
# =============================================================================

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Uploads are capped at 8 MB by the application (MAX_UPLOAD_BYTES); reject
    # anything larger at the edge rather than streaming it into the app.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    upstream backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 7860 default_server;
        server_name _;
        root /srv/www;
        index index.html;

        # Browser-side protections. The full Caddy profile (HSTS + the
        # generated CSP) belongs to the Stage-5 origin-TLS deployment; on the
        # Space, HSTS is the platform's to send, and these are ours.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # ---- D-4.1 CONDITION, ENFORCED AT THE EDGE TOO ----------------------
        # The application already closes these via API_DOCS_MODE=disabled, and
        # demo_env.py refuses to boot if it does not. This block is the second
        # independent lock: even a misconfigured rebuild cannot publish the
        # interactive API surface map from this container.
        location = /docs          { return 404; }
        location = /redoc         { return 404; }
        location = /openapi.json  { return 404; }
        location ^~ /docs/        { return 404; }
        location ^~ /redoc/       { return 404; }

        # Prometheus metrics are not for the public internet.
        location = /metrics { return 404; }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # The HF edge terminates TLS; tell the app the browser used https
            # so secure-cookie and redirect logic behave correctly.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_set_header Connection        "";
            # The first /recommend after a cold start pays model + index warm-up.
            proxy_read_timeout 120s;
        }

        location /media/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection      "";
        }

        # Hashed immutable assets.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA fallback — client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
