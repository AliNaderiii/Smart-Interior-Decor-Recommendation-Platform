<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Interior Decor — AI-matched living room furniture with explainable recommendations, moodboards and floorplans." />
    <meta name="theme-color" content="#FAF9F7" />
    <!-- Product photography host. NO crossorigin: <img> fetches are no-cors
         (credentialed pool), so an anonymous (crossorigin) preconnect opens a
         socket the images can never reuse — the warm-up was wasted and the
         LCP image paid full DNS+TCP+TLS on every cold view (T-2.1 baseline:
         recommendations/mobile LCP 4386ms, run 33078900123). -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <title>Smart Decor — AI Living Room Recommendations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
